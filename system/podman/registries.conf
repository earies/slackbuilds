# Registry configuration in v2 format.
# See containers-registries.conf(5).

# Registries searched for unqualified image names, in order.
unqualified-search-registries = [
  "docker.io",
  "quay.io",
  "registry.fedoraproject.org",
  "registry.access.redhat.com",
  "registry.centos.org",
]

# No insecure or blocked registries are configured.
# To configure one, use a [[registry]] table with location and
# insecure = true or blocked = true.
